# PostgreSQL in one command, without installing it:
#   docker compose up -d        start in the background
#   docker compose ps           is it "healthy"?
#   docker compose down         stop (the data stays in the volume)
#   docker compose down -v      stop and DELETE the data
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
      POSTGRES_DB: training
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
